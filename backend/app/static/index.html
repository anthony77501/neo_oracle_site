<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="title"></title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    .canvas-wrap { position: relative; display: inline-block; max-width: 100%; }
    #overlay { position: absolute; top: 0; left: 0; pointer-events: none; }
    /* Styles pour les champs de contrôle */
    .actions {
        display: flex;
        gap: 1rem;
        align-items: center;
        margin-top: 1rem;
    }
    .actions label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }
    /* Styles de base (ajustez si nécessaire) */
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .container { max-width: 1000px; margin: 0 auto; padding: 2rem 1rem; }
  </style>
  
</head>
<body>
    <!-- Sélecteur langue -->
  <div style="position:fixed; top:.75rem; right:1rem;">
    <select id="lang">
      <option value="fr">FR</option>
      <option value="en">EN</option>
      <option value="ja">日本語</option>
    </select>
  </div>

  <script src="/static/i18n.js"></script>

  <header class="container">
    <h1 data-i18n="title"></h1>
    <p class="badge" data-i18n="{{ 'detector_loaded' if detector_loaded else 'detector_absent' }}"></p>
  </header>

  <main class="container">
    <div class="dropzone" id="dropzone">
      <input id="file-input" type="file" accept="image/*" hidden />
      <div id="drop-content">
        <p>
          <strong data-i18n="drop_hint">Glissez-déposez une image ici, ou</strong>
          <button id="browse-btn" class="btn" data-i18n="choose_file">choisir un fichier</button>
        </p>
        <p class="hint" data-i18n="formats">JPEG / PNG / WebP — max 30 Mo</p>
      </div>
      <div class="canvas-wrap">
        <img id="preview" alt="aperçu" style="display:none; max-width:100%; border-radius:1rem;" />
        <canvas id="overlay" style="display:none;"></canvas>
      </div>
    </div>

    <div class="actions">
      <!-- Seuil de détection (YOLO) -->
      <label>
        <span data-i18n="det_threshold">Seuil détection</span>:
        <input id="det-conf" type="number" value="0.35" step="0.05" min="0" max="1" style="width:80px;">
      </label>
      <!-- Seuil de classification (Compromis Ripe) -->
      <label>
        <span data-i18n="cls_threshold">Seuil maturité</span>:
        <input id="cls-conf" type="number" value="0.50" step="0.05" min="0" max="1" style="width:80px;">
      </label>
      <button id="predict-btn" class="btn primary" disabled data-i18n="analyze">Analyser</button>
      <button id="reset-btn" class="btn" disabled data-i18n="reset">Réinitialiser</button>
    </div>

    <section id="result" class="result" style="display:none;">
      <h2 data-i18n="result">Résultats</h2>
      <div id="list"></div>
    </section>
  </main>

  <script>
    const dz = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');
    const browseBtn = document.getElementById('browse-btn');
    const predictBtn = document.getElementById('predict-btn');
    const resetBtn = document.getElementById('reset-btn');
    const detConfInput = document.getElementById('det-conf');
    const clsConfInput = document.getElementById('cls-conf');

    const preview = document.getElementById('preview');
    const overlay = document.getElementById('overlay');
    const result = document.getElementById('result');
    const listEl = document.getElementById('list');

    let currentFile = null;

    function enableActions(enabled) {
      predictBtn.disabled = !enabled;
      resetBtn.disabled = !enabled;
    }

    function resizeCanvasToImage() {
      // S'assurer que le canvas a la même taille que l'image affichée
      overlay.width = preview.naturalWidth;
      overlay.height = preview.naturalHeight;
      overlay.style.width = preview.clientWidth + 'px';
      overlay.style.height = preview.clientHeight + 'px';
      overlay.style.display = 'block';
    }

    function clearOverlay() {
      const ctx = overlay.getContext('2d');
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      overlay.style.display = 'none';
    }

    function drawBoxes(items, imgW, imgH) {
      const ctx = overlay.getContext('2d');
      ctx.lineWidth = 2;

      const dispW = preview.clientWidth;
      const dispH = preview.clientHeight;
      const scaleX = dispW / imgW;
      const scaleY = dispH / imgH;

      items.forEach((it, i) => {
        // Extraction des données (assurez-vous que les champs correspondent au backend)
        const [x1, y1, x2, y2] = it.box;
        const maturityLabel = it.cls_label || "unknown";
        const maturityConf = it.cls_conf || 0;
        const detConf = it.det_conf || 0;

        // Définition de la couleur
        const color = maturityLabel === 'ripe' ? '#34d399' : '#ff0000'; // Vert pour mûr, Rouge pour non-mûr
        ctx.strokeStyle = color;
        ctx.fillStyle = color;

        // Redimensionnement de la boîte pour l'affichage
        const rx = x1 * scaleX;
        const ry = y1 * scaleY;
        const rw = (x2 - x1) * scaleX;
        const rh = (y2 - y1) * scaleY;

        ctx.strokeRect(rx, ry, rw, rh);

        // Création de l'étiquette de texte
        const detText = `${t('det')} ${Math.round(detConf * 100)}%`;
        const clsText = `${t(maturityLabel)} ${Math.round(maturityConf * 100)}%`;
        const text = `${detText} | ${clsText}`;

        // Dessin de l'étiquette
        ctx.font = '12px system-ui';
        const tw = ctx.measureText(text).width + 6;
        const th = 16;
        ctx.fillRect(rx, Math.max(ry - th, 0), tw, th);
        ctx.fillStyle = '#06102a'; // Couleur du texte
        ctx.fillText(text, rx + 3, Math.max(ry - 4, 12));
      });
    }

    function setFile(file) {
      currentFile = file;
      if (!file) {
        preview.src = '';
        preview.style.display = 'none';
        clearOverlay();
        result.style.display = 'none';
        enableActions(false);
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        preview.src = e.target.result;
        preview.style.display = 'block';
        clearOverlay();
        resizeCanvasToImage();
      };
      reader.readAsDataURL(file);
      enableActions(true);
    }

    browseBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => setFile(e.target.files[0]));

    dz.addEventListener('dragover', (e) => { e.preventDefault(); dz.classList.add('drag'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
    dz.addEventListener('drop', (e) => { e.preventDefault(); dz.classList.remove('drag'); setFile(e.dataTransfer.files[0]); });

    resetBtn.addEventListener('click', () => setFile(null));

    // --- Correction: Ajustement de l'URL de l'endpoint et envoi des seuils ---
    predictBtn.addEventListener('click', async () => {
      if (!currentFile) return;

      const detConf = parseFloat(detConfInput.value || '0.35');
      const clsConf = parseFloat(clsConfInput.value || '0.50');

      // Création du corps de la requête FormData
      const formData = new FormData();
      formData.append('file', currentFile);

      // Envoi de la requête à l'endpoint /predict (JSON)
      // Note: Pour afficher l'image annotée, il faut appeler /predict_image
      // const endpoint = `/predict?det_conf=${detConf}&class_conf_threshold=${clsConf}`; // Endpoint JSON
      const endpoint = `/predict_image?det_conf=${detConf}&class_conf_threshold=${clsConf}`; // Endpoint Image

      try {
        const r = await fetch(endpoint, { method: 'POST', body: formData });

        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          alert(`${t('error')}: ${err.detail || r.statusText}`);
          return;
        }

        // Si l'endpoint renvoie l'image annotée, mettez à jour la source de l'image.
        const blob = await r.blob();
        preview.src = URL.createObjectURL(blob);
        preview.style.display = 'block';

        // Mettre à jour la liste des résultats (optionnel si l'endpoint JSON est séparé)
        // Note: Pour récupérer les données JSON de l'endpoint /predict_image, il faut une astuce.
        // La solution la plus propre est de faire deux appels API (JSON puis Image),
        // ou de modifier l'endpoint /predict_image pour renvoyer le JSON et l'image.
        // Pour l'instant, nous affichons l'image annotée et supposons que la liste JSON est gérée par un appel séparé.

      } catch (e) {
        alert(`${t('error')}: ${e.message}`);
      }
    });

    // --- Amélioration: Internationalisation des labels ---
    const i18n = {
      fr: {
        title: 'Détection d\'épis de maïs',
        drop_hint: 'Glissez-déposez une image ici, ou',
        choose_file: 'choisir un fichier',
        formats: 'JPEG / PNG / WebP — max 30 Mo',
        det_threshold: 'Seuil détection',
        cls_threshold: 'Seuil maturité',
        analyze: 'Analyser',
        reset: 'Réinitialiser',
        result: 'Résultats',
        none_found: 'Aucune détection trouvée.',
        ripe: 'Mûr',
        unripe: 'Non-mûr',
        unknown: 'Inconnu',
        det: 'Det',
        error: 'Erreur',
        detector_loaded: 'Détecteur chargé',
        detector_absent: 'Détecteur absent',
      },
      en: {
        title: 'Maize Cob Recognition',
        drop_hint: 'Drag and drop an image here, or',
        choose_file: 'choose a file',
        formats: 'JPEG / PNG / WebP — max 30 MB',
        det_threshold: 'Detection threshold',
        cls_threshold: 'Maturity threshold',
        analyze: 'Analyze',
        reset: 'Reset',
        result: 'Results',
        none_found: 'No detections found.',
        ripe: 'Ripe',
        unripe: 'Unripe',
        unknown: 'Unknown',
        det: 'Det',
        error: 'Error',
        detector_loaded: 'Detector loaded',
        detector_absent: 'Detector absent',
      },
      ja: {
        title: 'トウモロコシの穂認識',
        drop_hint: '画像をここにドラッグ＆ドロップ、または',
        choose_file: 'ファイルを選択',
        formats: 'JPEG / PNG / WebP — 最大 30 MB',
        det_threshold: '検出閾値',
        cls_threshold: '成熟度閾値',
        analyze: '分析',
        reset: 'リセット',
        result: '結果',
        none_found: '検出されませんでした。',
        ripe: '熟している',
        unripe: '未熟',
        unknown: '不明',
        det: '検出',
        error: 'エラー',
        detector_loaded: '検出器ロード済み',
        detector_absent: '検出器なし',
      }
    };

    function t(key) {
      const lang = document.getElementById('lang').value;
      const texts = i18n[lang];
      return texts[key] || key;
    }

    // Initialisation de l'UI et internationalisation
    window.onload = () => {
        const langSelect = document.getElementById('lang');
        langSelect.addEventListener('change', () => applyTranslation(langSelect.value));
        applyTranslation(langSelect.value);
    };

    function applyTranslation(lang) {
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (i18n[lang] && i18n[lang][key]) {
                el.textContent = i18n[lang][key];
            } else if (i18n['fr'][key]) { // Fallback to French
                el.textContent = i18n['fr'][key];
            }
        });
    }

    // Rechargement de la page si l'image change pour s'assurer que le canvas est mis à jour.
    preview.addEventListener('load', () => {
        resizeCanvasToImage();
        // Optionnel: ré-analyser automatiquement après le rechargement.
    });
  </script>
</body>
</html>
